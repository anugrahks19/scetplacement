    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value || "anugrah@scet.ac.in";
            const rollNo = document.getElementById('password').value || "21CS001";
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            btn.disabled = true;
            err.style.display = 'none';

            try {
                const query = `
                    mutation Login($email: String!, $rollNo: String!) {
                        loginStudent(email: $email, rollNo: $rollNo) {
                            token
                        }
                    }
                `;
                const res = await fetch('http://localhost:4000/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, variables: { email, rollNo } })
                });
                
                const { data, errors } = await res.json();
                if (errors) throw new Error(errors[0].message);
                if (data?.loginStudent?.token) {
                    localStorage.setItem('student_token', data.loginStudent.token);
                    window.location.href = 'student/dashboard-student.html';
                } else {
                    throw new Error('Invalid credentials');
                }
            } catch (error) {
                err.textContent = error.message || 'Login failed';
                err.style.display = 'block';
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        }
    </script>
