services:
  postgres:
    image: postgres:16
    container_name: scetplacement_db
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johndoe -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scetplacement_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://johndoe:randompassword@postgres:5432/mydb?schema=public
      - JWT_SECRET=dev-secret
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
