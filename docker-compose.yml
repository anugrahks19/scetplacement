version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: scetplacement_db
    environment:
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scetplacement_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://johndoe:randompassword@postgres:5432/mydb?schema=public
      - JWT_SECRET=dev-secret
    depends_on:
      - postgres
